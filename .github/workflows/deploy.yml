name: Build & Deploy to Doker Hub

on: 
    push:
        branches: 
            - master
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with : 
                    username: ${{secrets.DOCKER_USERNAME}}
                    password: ${{secrets.DOCKER_PASSWORD}}
            
            - name: Build and Push docker Image
              uses: docker/build-push-action@v6
              with: 
                context: .
                file: ./Dockerfile
                push : true
                tags: soul2424/myportfolio:latest
            
            - name: Verify Pushed Image
              run: docker pull soul2424/myportfolio:latest

            - name: Deploy to EC2 server
              uses: appleboy/ssh-actions@master
              with:
                host: ${{secrets.SSH_Host}}
                username: ${{secrets.SSH_USERNAME}}
                key: ${{secrets.SSH_KEY}}
                script: |
                    sudo docker pull soul2424/myportfolio:latest
                    sudo docker stop myportfolio || true
                    sudo docker rm myportfolio || true
                    sudo docker run -d --name myPortfolio --restart unless-stopped -p 127.0.0.1:3005:3000 soul2424/myportfolio:latest




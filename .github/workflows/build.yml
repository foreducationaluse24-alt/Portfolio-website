
name:  build on PR

on: 
    pull_request:
        branches:
            - master

jobs:

    check:
        name : Build, Lint and Format
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses : actions/checkout@v4 

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: '20'
                cache: 'npm'

        
            - name: Install dependencies
              run: npm ci

            - name: Run Eslint
              run: npm run lint
        
            - name: Run Build
              run: npm run build
